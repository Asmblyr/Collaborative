name: asmblyr-collaborative

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asmblyr
      POSTGRES_USER: asmblyr
      POSTGRES_PASSWORD: asmblyr_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmblyr -d asmblyr"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
