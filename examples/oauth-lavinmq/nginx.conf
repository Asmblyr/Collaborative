server {
    # Container loopback only: the browser reaches the host UI directly on port 3000.
    listen 127.0.0.1:3000;
    listen [::1]:3000;
    server_name localhost;
    # OAuth codes and state must not enter development access logs.
    access_log off;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3000;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:3000;
    }
}

# Accessible only inside the demo network namespace; used by the disposable DB test.
server {
    listen 127.0.0.1:3002;
    listen [::1]:3002;
    server_name localhost;
    access_log off;
    location / {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host localhost:3002;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:3002;
    }
}
