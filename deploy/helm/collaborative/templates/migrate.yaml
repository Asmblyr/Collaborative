{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "collaborative.name" . }}-migrate
  labels:
    {{- include "collaborative.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collaborative
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "collaborative.image" (dict "root" . "component" "core") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, scripts/container/migrate.mjs]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          {{- if .Values.coreSecretFiles }}
          volumeMounts:
            {{- include "collaborative.secretMounts" . | nindent 12 }}
          {{- end }}
      {{- if .Values.coreSecretFiles }}
      volumes:
        {{- include "collaborative.secretVolumes" . | nindent 8 }}
      {{- end }}
{{- end }}
