{{- $root := . -}}
{{- range $component := list "core" "ui" }}
{{- $settings := index $root.Values $component }}
{{- $port := ternary 3001 3000 (eq $component "core") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collaborative.name" $root }}-{{ $component }}
  labels:
    {{- include "collaborative.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $settings.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collaborative
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        {{- toYaml $root.Values.podAnnotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      imagePullSecrets:
        {{- toYaml $root.Values.image.pullSecrets | nindent 8 }}
      nodeSelector:
        {{- toYaml $root.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $root.Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml $root.Values.affinity | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "collaborative.image" (dict "root" $root "component" $component) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          ports:
            - { name: http, containerPort: {{ $port }} }
          {{- if eq $component "core" }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" $root.Values.existingSecret }}
          {{- end }}
          env:
            {{- if eq $component "core" }}
            {{- include "collaborative.coreEnv" $root | nindent 12 }}
            {{- else }}
            - name: CORE_URL
              value: {{ printf "http://%s-core:3001" (include "collaborative.name" $root) | quote }}
            - name: SESSION_COOKIE_PREFIX
              value: {{ $root.Values.sessionCookiePrefix | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: {{ ternary "/health" "/healthz" (eq $component "core") }}, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: {{ ternary "/health" "/healthz" (eq $component "core") }}, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: {{ ternary "/ready" "/healthz" (eq $component "core") }}, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $component "core" }}
            {{- include "collaborative.secretMounts" $root | nindent 12 }}
            {{- end }}
            {{- if eq $component "ui" }}
            - { name: cache, mountPath: /app/apps/ui/.next/cache }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if eq $component "core" }}
        {{- include "collaborative.secretVolumes" $root | nindent 8 }}
        {{- end }}
        {{- if eq $component "ui" }}
        - name: cache
          emptyDir: { sizeLimit: 128Mi }
        {{- end }}
{{- end }}
