apiVersion: v1
kind: Namespace
metadata:
  name: collaborative
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: collaborative-db
  namespace: collaborative
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: collaborative
      owner: collaborative
      dataChecksums: true
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
    pg_hba:
      - hostnossl all all all reject
