name: Verify and publish containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:ci-ephemeral-test@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Check package archives and clean consumer
        run: pnpm packages:check

  container:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Helm
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -O https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          curl --fail --silent --show-error -O https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.2.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.2.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 helm-v4.2.3-linux-amd64.tar.gz*
      - name: Build matching Core and UI images from source
        shell: bash
        run: |
          set -euo pipefail
          for component in core ui; do
            docker build --target "$component" --build-arg DEPLOYMENT_VERSION="$GITHUB_SHA" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --label org.opencontainers.image.licenses=MIT \
              --tag "asmblyr-collaborative-$component:ci" .
          done
      - name: Check split containers with disposable PostgreSQL
        run: node scripts/test.mjs container-split asmblyr-collaborative-core:ci asmblyr-collaborative-ui:ci
      - name: Validate chart and routing
        run: node scripts/chart-check.mjs
      - name: Publish verified image pair and chart
        if: >-
          github.repository == 'Asmblyr/Collaborative' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/container/publish.sh
