stages: [verify, release]

verify:
  stage: verify
  image: node:22-bookworm-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ci-ephemeral-test
    TEST_DATABASE_ADMIN_URL: postgresql://postgres:ci-ephemeral-test@postgres:5432/postgres
  script:
    - corepack enable
    - corepack prepare pnpm@11.13.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm check
    - pnpm build

release-images:
  stage: release
  image: docker:29-cli
  services: [docker:29-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --target core -t "$CI_REGISTRY_IMAGE/core:$CI_COMMIT_SHA" .
    - docker build --target ui -t "$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/core:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/ui:$CI_COMMIT_SHA"
